# Y27 — 全屏预览 / 下载 / 删除（PRD 十二~十四、33.3~33.4）
page:
  id: aside-y27-viewer
  title: Photo Viewer
  isNative: true
  skipNavigation: true
  navigationPrompt: ""
  blurTarget: the photo viewer top bar
  aiContext: >
    Full-screen preview: back, overflow •••, bottom Download.
    Menu: Add to Album / Download / Delete / Cancel.
    Toast Saved to Photos. Dialog Delete this photo? / removed from PicBox.
  bottomFields:
    - Download

dropdowns: []
inputs: []

flow:
  - section: Open
    type: action
    action: tap-text
    label: 顶栏 Photos
    assertPrompt: Photos
    scrollBeforeTap: false
    optional: true
    locatePrompt: >
      Top "Photos" segment if needed.

  - section: Open
    type: action
    action: wait-page
    label: 确认有图
    manualWaitSec: 6
    assertPrompt: >
      My Photos with at least one photo thumbnail (not system picker).

  - section: Open
    type: action
    action: tap-text
    label: 点击任意图片
    assertPrompt: photo
    scrollBeforeTap: false
    locatePrompt: >
      First/top photo in My Photos masonry. Do NOT tap +, Albums, or system Done.

  - section: Viewer
    type: action
    action: wait-page
    label: 等待全屏预览
    manualWaitSec: 8
    assertPrompt: >
      In-app full-screen photo preview (PicBox), NOT system picker. Large photo + Download and/or •••.

  - section: Viewer
    type: verify
    label: 33.1 全屏预览
    retry: 2
    assertPrompt: >
      PRD: full-screen photo viewer with large image. Fail if still My Photos grid only or system picker.

  - section: Download
    type: action
    action: tap-text
    label: 33.3 Download
    assertPrompt: Download
    scrollBeforeTap: true
    locatePrompt: >
      Bottom "Download" on photo viewer, OR open ••• then Download. Do NOT tap Delete.

  - section: Download
    type: action
    action: handle-permissions
    label: 下载权限

  - section: Download
    type: verify
    label: 33.3 Saved to Photos
    retry: 3
    retryDelayMs: 700
    assertPrompt: >
      PRD: toast/banner "Saved to Photos" OR clear save success. FAIL if only "Couldn't save photo".

  - section: Delete
    type: action
    action: tap-text
    label: 打开 ••• 菜单
    assertPrompt: overflow
    scrollBeforeTap: false
    locatePrompt: >
      Top-right overflow ••• / ... on photo viewer.

  - section: Delete
    type: action
    action: tap-text
    label: 菜单 Delete
    assertPrompt: Delete
    scrollBeforeTap: false
    locatePrompt: >
      Sheet/menu item "Delete" (not Download, not Add to Album).

  - section: Delete
    type: verify
    label: 33.4 删除确认框
    retry: 2
    assertPrompt: >
      Dialog "Delete this photo?" (may mention PicBox) with Cancel and Delete.

  - section: Delete
    type: action
    action: tap-text
    label: 先 Cancel
    assertPrompt: Cancel
    scrollBeforeTap: false
    locatePrompt: >
      Dialog Cancel (NOT Delete).

  - section: Delete
    type: action
    action: wait-page
    label: Cancel 后仍在预览
    manualWaitSec: 5
    assertPrompt: >
      Still on full-screen preview; dialog closed.

  - section: Delete
    type: action
    action: tap-text
    label: 再开 •••
    assertPrompt: overflow
    scrollBeforeTap: false
    locatePrompt: >
      Top-right ••• on viewer.

  - section: Delete
    type: action
    action: tap-text
    label: 再点 Delete
    assertPrompt: Delete
    scrollBeforeTap: false
    locatePrompt: >
      Menu "Delete".

  - section: Delete
    type: action
    action: tap-text
    label: 确认 Delete
    assertPrompt: Delete
    scrollBeforeTap: false
    locatePrompt: >
      Confirm dialog destructive Delete (NOT Cancel).

  - section: Delete
    type: action
    action: wait-page
    label: 删除后回首页
    manualWaitSec: 8
    assertPrompt: >
      Back on My Photos after delete.

  - section: Delete
    type: verify
    label: 33.4 图片已从 App 移除
    retry: 2
    assertPrompt: >
      PRD 33.4: deleted photo gone from My Photos view (grid/empty). Soft-pass if home refreshed.

  - section: Reimport
    type: action
    action: tap-text
    label: 再导入入口
    assertPrompt: +
    scrollBeforeTap: false
    locatePrompt: >
      "+" or "+ Add Photos" on My Photos.

  - section: Reimport
    type: action
    action: tap-text
    label: Choose from Gallery
    assertPrompt: Choose from Gallery
    scrollBeforeTap: false
    optional: true
    locatePrompt: >
      Choose from Gallery if sheet shown.

  - section: Reimport
    type: action
    action: handle-permissions
    label: 再导入权限

  - section: Reimport
    type: action
    action: pick-gallery-image
    label: 再选一张
    contactIndex: 0

  - section: Reimport
    type: action
    action: wait-page
    label: 确认首页有图
    manualWaitSec: 10
    assertPrompt: >
      My Photos shows at least one photo again.

submit:
  enabled: false
