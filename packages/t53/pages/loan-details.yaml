# T53 Loan Details — PRD 三十六
page:
  id: aside-t53-loan-details
  title: Loan Details
  isNative: true
  skipNavigation: true
  navigationPrompt: ""
  blurTarget: Loan Details
  aiContext: Loan Details. Loan Amount, Outstanding, Borrowed On, Due Date, APR, Payment History.
  bottomFields: []
dropdowns: []
inputs: []
flow:
  - section: Details
    type: action
    action: wait-page
    label: 等待 Loan Details
    manualWaitSec: 8
    assertPrompt: '"Loan Details" is visible.'
  - section: Details
    type: verify
    label: Loan Details 字段
    assertPrompt: >
      Shows "Loan Amount" "₹10,000", "Outstanding" "₹10,000", "Borrowed On", "Due Date", "APR",
      and "Payment History" including "Borrowed".
  - section: Details
    type: verify
    label: UI Loan Details PRD
    assertPrompt: >
      STRICT: warm off-white background #F4F3EF, primary blue #1D4ED8 buttons with about 6dp corners (not pills), title/amount near #171717, secondary #6B7280. Fail if yellow notes, retro paper, black gallery, or cream sticker theme.
  - section: Details
    type: action
    action: android-back
    label: 返回首页以还款
