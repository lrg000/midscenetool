# A 面包注册表：一个 Android 包 = 一套 YAML + 一个 tests/aside/*.test.ts
# kind 约定：T* → loan-shell / loan-postlogin；Y* → standalone
# kind: standalone | loan-shell | loan-postlogin
# actionDomains: common / loan / calendar / notes / gallery / stickers（见 core/actions/domains.ts）
# B 面（登录后 H5 模版）仍用 config/flows.yaml + data/*.yaml；仅贷款壳可配置 handoffFlow。
packages:
  t42:
    name: T42.RajWise
    description: |
      冷启/协议 → Welcome OTP 登录 → Get Cash Now 主流程 → 贷款详情/Profile/Account Details（对齐 Figma）。
    kind: loan-shell
    actionDomains:
      - common
      - loan
    appLabel: RajWise
    androidPackage: com.rajwiseguide.loanadvisor.app
    pages:
      - id: aside-t42-bootstrap
        dataFile: pages/bootstrap.yaml
      - id: aside-t42-login
        dataFile: pages/login.yaml
      - id: aside-t42-home
        dataFile: pages/home.yaml
      - id: aside-t42-personal-information
        dataFile: pages/personal-information.yaml
      - id: aside-t42-document-upload
        dataFile: pages/document-upload.yaml
      - id: aside-t42-face-verification
        dataFile: pages/face-verification.yaml
      - id: aside-t42-verification-result
        dataFile: pages/verification-result.yaml
      - id: aside-t42-personal-loan
        dataFile: pages/personal-loan.yaml
      - id: aside-t42-business-loan
        dataFile: pages/business-loan.yaml
      - id: aside-t42-profile
        dataFile: pages/profile.yaml
      - id: aside-t42-help-support
        dataFile: pages/help-support.yaml
      - id: aside-t42-account-details
        dataFile: pages/account-details.yaml
  t42-postlogin:
    name: T42.RajWise 登录后
    description: |
      已登录：Get Cash Now 主流程 + 贷款详情/Profile/Help/Account Details（换头像+填写+Save）对齐 Figma。
